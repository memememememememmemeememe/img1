<!DOCTYPE html>
<html>
<head>
    <title>TurboWarp Video Player - Sound Enabled</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            cursor: pointer; /* Shows a pointer so users know they can click */
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <video id="myVideo" controls playsinline>
        <source src="ad3.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <script>
        const video = document.getElementById('myVideo');

        // Automatically try to play (browsers might mute or block this initially)
        video.play().catch(error => {
            console.log("Browser blocked autoplay with audio. Waiting for user interaction to play with sound...");
        });

        // The magic trick: The moment the user clicks anywhere inside the project/iframe, 
        // the video instantly plays with audio fully enabled!
        window.addEventListener('click', () => {
            if (video.paused) {
                video.play();
            }
        });
    </script>

</body>
</html>
