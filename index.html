<!DOCTYPE html>
<html>
<head>
    <title>TurboWarp Image Viewer</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black; /* Changes background color behind the image */
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Fits the whole image perfectly */
        }
    </style>
</head>
<body>

    <img src="https://raw.githubusercontent.com/memememememememmemeememe/img1/refs/heads/main/IMG_3305.heic" alt="My TurboWarp Image">

</body>
</html>
